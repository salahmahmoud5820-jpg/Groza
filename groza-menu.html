<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GROZA FOOD TRUCK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Anton&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#E3A93B; --yellow-2:#F3D896; --black:#1c1712; --cream:#FBF7EF; --accent:#E8542C; --accent-2:#FF7A45;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;scroll-behavior:smooth;}
body{
  background:var(--cream); color:var(--yellow); font-family:'Cairo',sans-serif;
  overflow-x:hidden; position:relative;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.txt{ text-shadow:2px 2px 0 var(--black),-1px -1px 0 var(--black),0 0 10px rgba(0,0,0,.25); }
canvas#bg{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }

/* NAV */
nav#pillnav{
  position:sticky; top:calc(10px + env(safe-area-inset-top,0px)); z-index:50;
  display:flex; gap:6px; overflow-x:auto; padding:10px 14px; margin:0 auto;
  max-width:960px; -ms-overflow-style:none; scrollbar-width:none;
  transition:transform .35s ease;
}
nav#pillnav::-webkit-scrollbar{display:none;}
nav#pillnav a{
  flex:none; font-size:.78rem; font-weight:700; color:var(--yellow);
  background:var(--black); border:2px solid var(--yellow); border-radius:20px;
  padding:7px 16px; text-decoration:none; white-space:nowrap;
  box-shadow:0 4px 10px rgba(0,0,0,.25); transition:transform .15s ease;
}
nav#pillnav a.active{ background:var(--yellow); color:var(--black); transform:scale(1.06); }
nav.hide{ transform:translateY(-140%); }

/* HERO */
header{ text-align:center; padding:20px 16px 30px; position:relative; z-index:1; }
.logo-ring{
  width:130px;height:130px;border-radius:50%; margin:0 auto 16px; position:relative;
  background:conic-gradient(from 0deg,var(--yellow),#b98600,var(--yellow-2),var(--yellow));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 6px var(--black),0 12px 28px rgba(0,0,0,.3);
  animation:spin 14s linear infinite;
}
.logo-ring::before{ content:"";position:absolute; inset:16px; border-radius:50%; background:#fff; border:4px solid var(--black); }
.logo-ring::after{ content:"";position:absolute; width:12px;height:12px;background:var(--black);border-radius:50%; }
@keyframes spin{ to{ transform:rotate(360deg); } }
h1.brand{
  font-family:'Anton',sans-serif; font-size:clamp(2.6rem,9vw,4.4rem); letter-spacing:3px; margin:4px 0 0;
}
.brand-sub{
  font-family:'Anton',sans-serif; font-size:clamp(.9rem,2.6vw,1.2rem); letter-spacing:8px;
  color:var(--black); background:var(--yellow); display:inline-block; padding:3px 16px; border-radius:4px; margin-top:6px;
}
.contact{
  margin:26px auto 0; max-width:520px; background:rgba(10,10,10,.92); backdrop-filter:blur(6px);
  border:1px solid var(--yellow); border-radius:20px; padding:18px 20px;
  box-shadow:0 0 0 1px rgba(255,196,0,.15) inset, 0 12px 30px rgba(0,0,0,.3);
  display:flex; flex-direction:column; gap:10px;
}
.contact-row{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:.95rem; justify-content:center; text-align:center; }
.contact-row .ic{
  width:34px;height:34px;border-radius:50%; background:var(--yellow); color:var(--black);
  display:flex;align-items:center;justify-content:center; font-size:1rem; flex:none;
}
.contact a{ color:var(--yellow); text-decoration:none; }
.contact .phones{ font-size:1.1rem; letter-spacing:.4px; }

/* CATEGORY SECTIONS */
.cat{ max-width:980px; margin:0 auto 26px; padding:0 16px; position:relative; z-index:1;
  opacity:0; transform:translateY(24px); transition:opacity .6s ease, transform .6s ease; }
.cat.show{ opacity:1; transform:none; }
.cat-badge{
  width:150px;height:150px;border-radius:50%; margin:0 auto 8px; position:relative; overflow:hidden;
  background:var(--black); border:5px solid var(--yellow);
  display:flex;align-items:center;justify-content:center;flex-direction:column; text-align:center;
  cursor:pointer; -webkit-tap-highlight-color:transparent;
  box-shadow:0 0 0 0 rgba(255,196,0,.5), 0 8px 20px rgba(0,0,0,.35);
  transition:transform .2s ease, box-shadow .3s ease;
}
.cat-badge:hover{ transform:scale(1.05); }
.cat-badge.open{ box-shadow:0 0 0 8px rgba(255,196,0,.18), 0 10px 26px rgba(0,0,0,.4); }
.cat-badge span.en{ font-family:'Anton',sans-serif; font-size:1.3rem; letter-spacing:1px; position:relative; z-index:2; }
.cat-badge .arrow{ position:relative; z-index:2; margin-top:4px; font-size:.85rem; transition:transform .3s ease; }
.cat-badge.open .arrow{ transform:rotate(180deg); }
.cat-hint{ text-align:center; font-size:.7rem; color:var(--black); background:var(--yellow); display:block; width:fit-content;
  margin:0 auto 16px; padding:2px 12px; border-radius:10px; letter-spacing:1px; }
.ripple{ position:absolute; border-radius:50%; background:rgba(255,255,255,.5); transform:scale(0);
  animation:ripple .6s ease-out forwards; pointer-events:none; z-index:1; }
@keyframes ripple{ to{ transform:scale(2.8); opacity:0; } }

.items-panel{ max-height:0; overflow:hidden; transition:max-height .5s cubic-bezier(.4,0,.2,1); }
.items-panel.open{ max-height:5000px; }
.items-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; padding-top:8px; }
.item-card{
  position:relative; background:rgba(0,0,0,.94); border:1px solid rgba(255,196,0,.5); border-radius:16px;
  padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px;
  box-shadow:0 6px 14px rgba(0,0,0,.2); overflow:hidden;
  animation:pop .4s ease both;
}
@keyframes pop{ from{opacity:0; transform:translateY(10px) scale(.97);} to{opacity:1; transform:none;} }
.item-card::before{
  content:""; position:absolute; inset:0; border-radius:16px; padding:1px;
  background:linear-gradient(135deg,var(--yellow),transparent 40%,transparent 60%,var(--yellow));
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; opacity:.6; pointer-events:none;
}
.item-name{ font-weight:700; font-size:.98rem; }
.item-desc{ display:block; font-weight:400; font-size:.76rem; color:var(--yellow-2); opacity:.85; margin-top:3px; line-height:1.5; }
.price{
  font-family:'Anton',sans-serif; border:2px solid var(--yellow); border-radius:10px;
  padding:4px 10px; font-size:1rem; white-space:nowrap; text-align:center; min-width:56px;
}
.price small{ display:block; font-size:.55rem; font-family:'Cairo',sans-serif; letter-spacing:1px; }

footer{ text-align:center; padding:34px 16px 70px; position:relative; z-index:1; }
footer .logo-ring{ width:64px; height:64px; margin-bottom:10px; animation-duration:20s; }

.music-btn{
  position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); left:18px;
  width:58px;height:58px;border-radius:50%; background:var(--black); border:3px solid var(--yellow);
  color:var(--yellow); font-size:1.3rem; display:flex;align-items:center;justify-content:center;
  cursor:pointer; box-shadow:0 6px 16px rgba(0,0,0,.35); z-index:99; gap:2px;
}
.eq{ display:flex; align-items:flex-end; gap:2px; height:16px; }
.eq span{ width:3px; background:var(--yellow); border-radius:2px; animation:eq .8s ease-in-out infinite; }
.eq span:nth-child(2){ animation-delay:.15s; } .eq span:nth-child(3){ animation-delay:.3s; }
@keyframes eq{ 0%,100%{height:4px;} 50%{height:16px;} }

/* CART */
.add-btn{
  width:30px;height:30px;border-radius:50%; border:2px solid var(--accent); background:transparent;
  color:var(--accent); font-size:1.1rem; line-height:1; cursor:pointer; flex:none;
  display:flex; align-items:center; justify-content:center; transition:transform .15s ease, background .15s ease, color .15s ease;
}
.add-btn:hover{ transform:scale(1.12); background:var(--accent); color:#fff; }
.price-row{ display:flex; flex-direction:column; gap:6px; align-items:stretch; }
.price-opt{ display:flex; align-items:center; gap:6px; }

.cart-btn{
  position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); right:18px;
  width:58px;height:58px;border-radius:50%; background:var(--black); border:3px solid var(--yellow);
  color:var(--yellow); font-size:1.4rem; display:flex;align-items:center;justify-content:center;
  cursor:pointer; box-shadow:0 6px 16px rgba(0,0,0,.35); z-index:99;
}
.cart-count{
  position:absolute; top:-6px; left:-6px; background:var(--accent); color:#fff;
  font-family:'Anton',sans-serif; font-size:.75rem; min-width:22px; height:22px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; border:2px solid var(--black);
}
.cart-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(2px);
  z-index:150; display:none; align-items:flex-end; justify-content:center;
}
.cart-overlay.open{ display:flex; }
.cart-panel{
  width:100%; max-width:520px; max-height:82vh; background:#fff; border-radius:22px 22px 0 0;
  border:3px solid var(--yellow); border-bottom:none; padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
  overflow-y:auto; box-shadow:0 -10px 30px rgba(0,0,0,.4); transform:translateY(100%); transition:transform .35s ease;
}
.cart-overlay.open .cart-panel{ transform:translateY(0); }
.cart-panel h2{ font-family:'Anton',sans-serif; color:var(--black); text-align:center; margin:0 0 14px; letter-spacing:1px; }
.cart-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--black);
  border:1px solid var(--yellow); border-radius:14px; padding:10px 14px; margin-bottom:10px;
}
.cart-row .info{ flex:1; }
.cart-row .info b{ color:var(--yellow); font-size:.92rem; display:block; }
.cart-row .info span{ color:var(--yellow-2); font-size:.75rem; }
.qty-ctrl{ display:flex; align-items:center; gap:8px; }
.qty-ctrl button{
  width:26px;height:26px;border-radius:50%; border:1px solid var(--yellow); background:transparent;
  color:var(--yellow); cursor:pointer; font-size:1rem; line-height:1;
}
.qty-ctrl b{ color:var(--yellow); min-width:16px; text-align:center; }
.cart-empty{ text-align:center; color:#777; padding:30px 0; }
.cart-total{
  display:flex; justify-content:space-between; align-items:center; font-family:'Anton',sans-serif;
  color:var(--black); font-size:1.2rem; border-top:2px dashed var(--black); padding-top:12px; margin-top:6px;
}
.checkout-btn{
  width:100%; margin-top:14px; padding:14px; border:none; border-radius:14px; cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; font-family:'Anton',sans-serif; font-size:1rem; letter-spacing:1px;
  box-shadow:0 6px 14px rgba(232,84,44,.35);
}
.close-cart{ position:absolute; top:14px; left:18px; background:none; border:none; font-size:1.4rem; color:var(--black); cursor:pointer; }
.cart-panel{ position:relative; }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<nav id="pillnav"></nav>

<header>
  <div class="logo-ring txt"></div>
  <h1 class="brand txt">GROZA</h1>
  <div class="brand-sub">FOOD TRUCK</div>
  <div class="contact txt">
    <div class="contact-row"><span class="ic">📍</span><span>ش محمد حسنين هيكل - أمام البنك الأهلي - موازي ش عباس المقاد، مدينة نصر</span></div>
    <div class="contact-row phones"><span class="ic">📞</span><span><a href="tel:0101733503">010 1733 5030</a> &nbsp;|&nbsp; <a href="tel:0115712261">011 5712 2261</a></span></div>
  </div>
</header>

<div id="menu"></div>

<footer>
  <div class="logo-ring txt"></div>
  <div class="txt">GROZA FOOD TRUCK &copy; 2026</div>
</footer>

<button class="music-btn" id="musicBtn" title="تشغيل الموسيقى"><span id="musicIcon">🎵</span></button>

<button class="cart-btn" id="cartBtn" title="السلة">
  🛒<span class="cart-count" id="cartCount" style="display:none;">0</span>
</button>

<div class="cart-overlay" id="cartOverlay">
  <div class="cart-panel">
    <button class="close-cart" id="closeCart">✕</button>
    <h2>سلة الطلبات</h2>
    <div id="cartItems"></div>
    <div id="cartFooter"></div>
  </div>
</div>

<script>
const menu = [
 {id:"extra", title:["EXTRA"], items:[
   {n:"صوص باربكيو",p:10},{n:"صوص جروزا",p:10},{n:"صوص رانش",p:10},{n:"صوص بافلو",p:15},
   {n:"صوص تكساس",p:15},{n:"مسطردة عسل",p:10},{n:"شيدر أمريكي",p:10},{n:"سويت شيلي",p:15},
   {n:"خيار مخلل",p:10},{n:"مشروم",p:10},{n:"طماطم متبلة",p:10},{n:"إضافة موزريلا",p:10}
 ]},
 {id:"appetizer", title:["APPETIZER"], items:[
   {n:"باكت بطاطس",p:30},{n:"بطاطس هلابينو",p:50},{n:"بطاطس بيكون",p:65},
   {n:"بطاطس جروزا",p:95},{n:"موزريلا استيكس + حلقات بصل",p:50}
 ]},
 {id:"grill", title:["SPECIAL","GRILL"], items:[
   {n:"تشيكن فاهيتا",p:100},{n:"فاهيتا ميكس جبن",p:110},{n:"سجق شرقي",p:70},
   {n:"سجق مشوي ميكس جبن",p:80},{n:"كفتة مشوية",p:60},{n:"هوت دوج كلاسيك",p:65},
   {n:"هوت دوج جروزا",p:75},{n:"ساندوتش بطاطس كاتشب ومايونيز",p:35},
   {n:"ساندوتش بطاطس شيدر",p:45},{n:"ستربس دجاج",p:60},{n:"كبدة",p:60}
 ]},
 {id:"pasta", title:["PASTA"], items:[
   {n:"مكرونة ريد صوص",p:50},{n:"مكرونة كبدة",p:75},{n:"مكرونة سجق",p:75},{n:"مكرونة فاهيتا دجاج",p:100}
 ]},
 {id:"hawawshi", title:["HAWAWSHI"], items:[
   {n:"حواوشي لحم حواوشي",p:75},{n:"لحم موزريلا حواوشي",p:80},{n:"لحم شيدر حواوشي",p:80},
   {n:"لحم ميكس جبن",p:85},{n:"حواوشي ميكس تركي",p:95},{n:"حواوشي بيتزا",p:80},{n:"حواوشي بيف بيكون",p:95}
 ]},
 {id:"chicken", title:["SPECIAL","CHICKEN"], items:[
   {n:"CHICKEN RANCH",d:"صدر دجاج كرسبي+صوص جروزا+صوص رانش+صوابع موزريلا+خس+خيار+طماطم",s:130,db:170},
   {n:"CHEESE FLY CHICKEN",d:"صدر دجاج كرسبي+صوص جروزا+صوص شيدر+صوص تكساس+خيار+خس+طماطم",s:110,db:150},
   {n:"FLY CHICKEN",d:"صدر دجاج كرسبي+صوص جروزا+صوص تكساس+خيار+خس+طماطم",s:100,db:140},
   {n:"CHICKEN TURKEY",d:"صدر دجاج كرسبي+تركي مدخن+صوص جروزا+صوص شيدر+خس+خيار+طماطم",s:130,db:170},
   {n:"CHICKEN BECON",d:"صدر دجاج كرسبي+بيف بيكون+صوص جروزا+صوص شيدر+صوص باربيكيو+حلقات بصل مقلي+خس+خيار+طماطم",s:140,db:170},
   {n:"CHICKEN JALAPENO",d:"صدر دجاج كرسبي+صوص جروزا+صوص شيدر+سويت شيلي+فلفل هلابينو+خس+خيار",s:120,db:160},
   {n:"CHEESE CHICKEN GRILL",d:"صدر دجاج مشوي+صوص جروزا+صوص شيدر+خس+خيار+طماطم",s:110,db:150},
   {n:"CHICKEN GRIL MUSHROOM",d:"صدر دجاج مشوي+صوص جروزا+صوص شيدر+مشروم+موزريلا+خس+طماطم",s:130,db:170},
   {n:"CHICKEN GRIL MOZZARELLA",d:"صدر دجاج مشوي+صوص جروزا+صوص شيدر+موزريلا+خس+خيار+طماطم",s:120,db:160}
 ]},
 {id:"beef", title:["SPECIAL","BEEF BURGER"], items:[
   {n:"BURGER GROZA",d:"برجر مشوي+صوص جروزا+صوص شيدر+سويت شيلي+موزريلا+خس+خيار مخلل",s:120,db:160},
   {n:"CHEESE BURGER",d:"برجر مشوي+صوص جروزا+صوص شيدر+صوص تكساس+خيار مخلل+خس+حلقات بصل",s:100,db:140},
   {n:"BURGER CLASSIC",d:"برجر مشوي+صوص جروزا+صوص تكساس+خيار مخلل+خس+حلقات بصل",s:90,db:130},
   {n:"BIG GROZA",d:"برجر مشوي+قطعة دجاج كرسبي+تركي مدخن+موزريلا+صوص شيدر+خس+خيار مخلل+حلقات بصل مقلي",db:175},
   {n:"BURGER VOLCANO",d:"برجر مشوي+صوص جروزا+صوص شيدر+موزريلا+خس+خيار مخلل+بصل مكرمل",s:120,db:160},
   {n:"BURGER JALAPENO",d:"برجر مشوي+صوص جروزا+صوص شيدر+سويت شيلي+فلفل هلابينو+خس+خيار مخلل+حلقات بصل",s:120,db:160},
   {n:"TARAB BURGER",d:"برجر ملفوف بمنديل طرب مشوي+صوص جروزا+صوص باربيكيو+خس+خيار مخلل+حلقات بصل",s:150},
   {n:"CREAMY MUSHROOM",d:"برجر مشوي+صوص جروزا+مشروم+كريمة+خيار مخلل+خس+بصل مكرمل",s:130,db:170},
   {n:"CLASSIC BACON",d:"برجر مشوي+صوص جروزا+صوص شيدر+صوص باربيكيو+بيف بيكون+خس+خيار مخلل+حلقات بصل مقلي",s:125,db:165}
 ]}
];

const nav = document.getElementById('pillnav');
const wrap = document.getElementById('menu');

menu.forEach(cat=>{
  const label = cat.title.join(' ');
  nav.innerHTML += `<a href="#${cat.id}" data-id="${cat.id}">${label}</a>`;

  const sec = document.createElement('section');
  sec.className='cat'; sec.id=cat.id;

  const badge = document.createElement('div');
  badge.className='cat-badge txt';
  badge.innerHTML = cat.title.map(t=>`<span class="en">${t}</span>`).join('') + '<span class="arrow">▾</span>';
  sec.appendChild(badge);

  const hint = document.createElement('div');
  hint.className='cat-hint'; hint.textContent='اضغط للعرض';
  sec.appendChild(hint);

  const panel = document.createElement('div');
  panel.className='items-panel';
  const grid = document.createElement('div');
  grid.className='items-grid';
  cat.items.forEach((it,idx)=>{
    const card=document.createElement('div');
    card.className='item-card';
    card.style.animationDelay=(idx*0.04)+'s';
    let priceHtml;
    if(it.p!==undefined){
      priceHtml = `<div class="price-row"><div class="price-opt"><div class="price txt">${it.p}</div>
        <button class="add-btn" data-name="${it.n}" data-variant="" data-price="${it.p}">+</button></div></div>`;
    } else {
      const s = it.s? `<div class="price-opt"><div>${it.s}<small>SINGLE</small></div>
        <button class="add-btn" data-name="${it.n}" data-variant="سنجل" data-price="${it.s}">+</button></div>`:'';
      const d = it.db? `<div class="price-opt"><div>${it.db}<small>DOUBLE</small></div>
        <button class="add-btn" data-name="${it.n}" data-variant="دابل" data-price="${it.db}">+</button></div>`:'';
      priceHtml = `<div class="price-row">${s}${d}</div>`;
    }
    card.innerHTML = `<div class="item-name txt">${it.n}${it.d?`<span class="item-desc">${it.d}</span>`:''}</div>${priceHtml}`;
    grid.appendChild(card);
  });
  panel.appendChild(grid);
  sec.appendChild(panel);
  wrap.appendChild(sec);

  badge.addEventListener('click', e=>{
    const rect = badge.getBoundingClientRect();
    const r = document.createElement('span'); r.className='ripple';
    const size = Math.max(rect.width, rect.height);
    r.style.width = r.style.height = size+'px';
    r.style.left = (e.clientX-rect.left-size/2)+'px';
    r.style.top = (e.clientY-rect.top-size/2)+'px';
    badge.appendChild(r); setTimeout(()=>r.remove(),650);
    playClick();
    const open = panel.classList.toggle('open');
    badge.classList.toggle('open', open);
    hint.textContent = open ? 'اضغط للإخفاء' : 'اضغط للعرض';
  });
});

/* nav active state + smooth click */
nav.querySelectorAll('a').forEach(a=>{
  a.addEventListener('click', e=>{
    e.preventDefault();
    document.getElementById(a.dataset.id).scrollIntoView({behavior:'smooth', block:'start'});
  });
});
const sections = [...document.querySelectorAll('.cat')];
const navLinks = [...nav.querySelectorAll('a')];
const obs = new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    if(en.isIntersecting) en.target.classList.add('show');
    if(en.intersectionRatio>0.4){
      navLinks.forEach(l=>l.classList.toggle('active', l.dataset.id===en.target.id));
    }
  });
},{threshold:[0.15,0.4]});
sections.forEach(s=>obs.observe(s));

/* hide nav on scroll down, show on scroll up */
let lastY=window.scrollY;
window.addEventListener('scroll', ()=>{
  const y=window.scrollY;
  nav.classList.toggle('hide', y>lastY && y>140);
  lastY=y;
},{passive:true});

/* animated background particles (grease/ember dots) */
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width=innerWidth; canvas.height=document.body.scrollHeight; }
resize(); window.addEventListener('resize', resize);
const dots = Array.from({length:36}, ()=>({
  x:Math.random()*innerWidth, y:Math.random()*canvas.height,
  r:Math.random()*2+1, v:Math.random()*0.3+0.1, o:Math.random()*0.4+0.1
}));
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#E3A93B';
  dots.forEach(d=>{
    d.y -= d.v;
    if(d.y < -10){ d.y = canvas.height+10; d.x = Math.random()*innerWidth; }
    ctx.globalAlpha = d.o;
    ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,7); ctx.fill();
  });
  ctx.globalAlpha=1;
  requestAnimationFrame(draw);
}
draw();

/* click sound */
let clickCtx;
function playClick(){
  clickCtx = clickCtx || new (window.AudioContext||window.webkitAudioContext)();
  const t=clickCtx.currentTime;
  const osc=clickCtx.createOscillator(), g=clickCtx.createGain();
  osc.type='sine'; osc.frequency.setValueAtTime(700,t);
  osc.frequency.exponentialRampToValueAtTime(220,t+0.12);
  g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
  osc.connect(g); g.connect(clickCtx.destination);
  osc.start(t); osc.stop(t+0.16);
}

/* ambient music */
let audioCtx, playing=false, nodes=[];
function startMusic(){
  audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
  const master=audioCtx.createGain(); master.gain.value=0.05; master.connect(audioCtx.destination);
  [261.6,293.7,329.6,392.0,440.0].forEach((freq,i)=>{
    const osc=audioCtx.createOscillator(); osc.type='sine'; osc.frequency.value=freq;
    const g=audioCtx.createGain(); g.gain.value=0;
    osc.connect(g); g.connect(master); osc.start();
    const lfo=setInterval(()=>{
      const t=audioCtx.currentTime;
      g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value,t);
      g.gain.linearRampToValueAtTime(Math.random()*0.15,t+2+i);
    },(3000+i*400));
    nodes.push({osc,g,lfo});
  });
}
function stopMusic(){ nodes.forEach(n=>{ try{n.osc.stop();}catch(e){} clearInterval(n.lfo); }); nodes=[]; }
document.getElementById('musicBtn').addEventListener('click', function(){
  playing=!playing;
  document.getElementById('musicIcon').innerHTML = playing ? '<span class="eq"><span></span><span></span><span></span></span>' : '🎵';
  if(playing) startMusic(); else stopMusic();
});

/* CART */
let cart = [];
const cartOverlay = document.getElementById('cartOverlay');
const cartCount = document.getElementById('cartCount');
const cartItemsEl = document.getElementById('cartItems');
const cartFooterEl = document.getElementById('cartFooter');

function cartKey(name,variant){ return name+'|'+variant; }

document.getElementById('menu').addEventListener('click', e=>{
  const btn = e.target.closest('.add-btn');
  if(!btn) return;
  e.stopPropagation();
  const name = btn.dataset.name, variant = btn.dataset.variant, price = Number(btn.dataset.price);
  const key = cartKey(name,variant);
  const existing = cart.find(c=>c.key===key);
  if(existing) existing.qty++;
  else cart.push({key,name,variant,price,qty:1});
  playClick();
  btn.style.transform='scale(1.4)'; setTimeout(()=>btn.style.transform='',150);
  renderCart();
});

function changeQty(key,delta){
  const it = cart.find(c=>c.key===key);
  if(!it) return;
  it.qty += delta;
  if(it.qty<=0) cart = cart.filter(c=>c.key!==key);
  renderCart();
}

function renderCart(){
  const totalQty = cart.reduce((s,c)=>s+c.qty,0);
  cartCount.textContent = totalQty;
  cartCount.style.display = totalQty>0 ? 'flex' : 'none';

  if(cart.length===0){
    cartItemsEl.innerHTML = '<div class="cart-empty">السلة فاضية أوضة 🛒</div>';
    cartFooterEl.innerHTML = '';
    return;
  }
  cartItemsEl.innerHTML = cart.map(c=>`
    <div class="cart-row">
      <div class="info"><b>${c.name}${c.variant?' - '+c.variant:''}</b><span>${c.price} ج.م × ${c.qty}</span></div>
      <div class="qty-ctrl">
        <button onclick="changeQty('${c.key}',-1)">−</button>
        <b>${c.qty}</b>
        <button onclick="changeQty('${c.key}',1)">+</button>
      </div>
    </div>`).join('');
  const total = cart.reduce((s,c)=>s+c.price*c.qty,0);
  const orderText = encodeURIComponent(
    'طلب من GROZA FOOD TRUCK:\n' +
    cart.map(c=>`- ${c.name}${c.variant?' ('+c.variant+')':''} × ${c.qty} = ${c.price*c.qty} ج.م`).join('\n') +
    `\nالإجمالي: ${total} ج.م`
  );
  cartFooterEl.innerHTML = `
    <div class="cart-total"><span>الإجمالي</span><span>${total} ج.م</span></div>
    <a class="checkout-btn" style="display:block;text-align:center;text-decoration:none;" target="_blank"
       href="https://wa.me/201017335030?text=${orderText}">إتمام الطلب عبر واتساب</a>`;
}
document.getElementById('cartBtn').addEventListener('click', ()=>{ cartOverlay.classList.add('open'); playClick(); });
document.getElementById('closeCart').addEventListener('click', ()=>cartOverlay.classList.remove('open'));
cartOverlay.addEventListener('click', e=>{ if(e.target===cartOverlay) cartOverlay.classList.remove('open'); });
renderCart();

</script>
</body>
